<h2>Bài 13 - Danh sách sản phẩm</h2>
<table border="1" cellpadding="8">
    <tr>
        <th>Ma San Pham</th>
        <th>Ten San Pham</th>
        <th>Gia San Pham</th>
        <th>Picture</th>
        <th>#</th>
    </tr>
    <tr *ngFor="let p of products">
        <td>{{p.ProductId}}</td>
        <td>{{p.ProductName}}</td>
        <td>{{p.Price}}</td>
        <td>
            <img [src]="p.Image" width="50">
        </td>
        <td>
            <a style="cursor:pointer; color: blue; text-decoration: underline;" (click)="viewDetail(p)">Details</a>
        </td>
    </tr>
</table>
